{% extends "base.html" %}
{% block title %}Categorías{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0"><i class="bi bi-tags"></i> Categorías</h1>
  <a href="{% url 'catalogo:categoria_crear' %}" class="btn btn-dark"><i class="bi bi-plus-lg"></i> Nueva categoría</a>
</div>
<div class="table-responsive">
<table class="table bg-white shadow-sm align-middle">
  <thead class="table-dark"><tr><th>Nombre</th><th>Slug</th><th class="text-center">Productos</th><th></th></tr></thead>
  <tbody>
  {% for c in categorias %}
    <tr>
      <td>{{ c.nombre }}<div class="small text-muted">{{ c.descripcion|truncatechars:70 }}</div></td>
      <td><code>{{ c.slug }}</code></td>
      <td class="text-center">{{ c.total }}</td>
      <td class="text-end text-nowrap">
        <a class="btn btn-sm btn-outline-dark" href="{% url 'catalogo:categoria_editar' c.pk %}"><i class="bi bi-pencil"></i></a>
        <a class="btn btn-sm btn-outline-danger" href="{% url 'catalogo:categoria_eliminar' c.pk %}"><i class="bi bi-trash"></i></a>
      </td>
    </tr>
  {% empty %}<tr><td colspan="4" class="text-muted text-center">Sin categorías.</td></tr>{% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
