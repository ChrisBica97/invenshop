{% extends "base.html" %}
{% block title %}Ingresar{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="card border-0 shadow-sm"><div class="card-body p-4">
      <h1 class="h4 mb-3 text-center"><i class="bi bi-person-lock"></i> Ingresar</h1>
      {% if next %}<div class="alert alert-info small">Iniciá sesión para continuar.</div>{% endif %}
      <form method="post" novalidate>
        {% csrf_token %}
        {% include "includes/form.html" %}
        <input type="hidden" name="next" value="{{ next }}">
        <button class="btn btn-dark w-100">Ingresar</button>
      </form>
      <p class="text-center mt-3 mb-0 small">¿No tenés cuenta? <a href="{% url 'usuarios:registro' %}">Registrate</a></p>
    </div></div>
  </div>
</div>
{% endblock %}
